<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>ContaFlow v2.0</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--sidebar:#0a0f1a;--card:#111827;--border:#1f2937;
  --accent:#10b981;--gold:#f59e0b;--red:#ef4444;
  --blue:#3b82f6;--purple:#8b5cf6;
  --text:#f1f5f9;--muted:#6b7280;--dim:#374151;
  --row:#0f1623;--row-h:#182030;
  --radius:10px;--font:'DM Mono',monospace;--serif:'Crimson Text',Georgia,serif;
}
@import url('https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@400;500&display=swap');
body{font-family:var(--font);background:var(--bg);color:var(--text);height:100vh;overflow:hidden;font-size:13px}
#app{display:flex;height:100vh}
#sidebar{width:220px;min-width:220px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:transform .3s;z-index:100}
.sidebar-logo{padding:20px 18px 14px;border-bottom:1px solid var(--border)}
.logo-name{font-size:14px;font-weight:500;color:var(--accent);letter-spacing:.5px}
.logo-sub{font-size:10px;color:var(--muted);margin-top:3px}
.logo-ver{font-size:9px;color:var(--purple);letter-spacing:1px;margin-top:2px}
.year-block{padding:12px 16px;border-bottom:1px solid var(--border)}
.year-label{font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.year-select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:7px 10px;color:var(--gold);font-family:var(--serif);font-size:17px;font-weight:600;outline:none;cursor:pointer}
nav{flex:1;padding:8px 0;overflow-y:auto}
.nav-section{font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;padding:10px 18px 4px;margin-top:4px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 18px;background:none;border:none;border-left:3px solid transparent;color:var(--muted);font-family:var(--font);font-size:12px;cursor:pointer;text-align:left;transition:all .15s}
.nav-btn:hover{background:#ffffff08;color:var(--text)}
.nav-btn.active{background:rgba(16,185,129,.1);border-left-color:var(--accent);color:var(--accent)}
.nav-btn .icon{font-size:15px;width:20px;text-align:center}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border)}
.sidebar-net{font-family:var(--serif);font-size:15px;font-weight:600}
.sidebar-meta{font-size:10px;color:var(--muted);margin-top:2px}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{padding:12px 22px;border-bottom:1px solid var(--border);background:var(--sidebar);display:flex;align-items:center;gap:12px;min-height:52px;flex-wrap:wrap}
.topbar-title{font-size:14px;font-weight:500;flex:1}
.topbar-sub{font-size:10px;color:var(--muted);margin-top:1px}
#sync-msg{font-size:11px;color:var(--accent);max-width:280px}
#sync-err{font-size:11px;color:var(--red);max-width:280px}
#content{flex:1;overflow-y:auto;padding:22px;background:var(--bg)}
.btn{border:none;border-radius:8px;padding:8px 16px;font-family:var(--font);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#059669}.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}.btn-ghost:hover{color:var(--text);border-color:var(--muted)}
.btn-danger{background:transparent;color:var(--red);border:1px solid rgba(239,68,68,.3)}
.btn-purple{background:rgba(139,92,246,.15);color:var(--purple);border:1px solid rgba(139,92,246,.3)}.btn-purple:hover{background:rgba(139,92,246,.25)}
.btn-sm{padding:5px 10px;font-size:11px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px}
.card-sm{padding:12px 16px}
.grid{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.kpi{flex:1;min-width:140px}
.kpi-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px}
.kpi-val{font-family:var(--serif);font-size:24px;font-weight:600}
.kpi-sub{font-size:10px;color:var(--muted);margin-top:3px}
table{width:100%;border-collapse:collapse}
th{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)}
td{padding:7px 10px;border-bottom:1px solid rgba(31,41,55,.5);font-size:12px}
tr:hover td{background:var(--row-h)}
.section-title{font-size:13px;font-weight:500;color:var(--text);margin-bottom:14px}
input,select,textarea{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:7px 11px;color:var(--text);font-family:var(--font);font-size:12px;outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input::placeholder{color:var(--muted)}
.input-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}
.tag{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:600;letter-spacing:.3px}
.tag-green{background:rgba(16,185,129,.15);color:var(--accent);border:1px solid rgba(16,185,129,.3)}
.tag-red{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.3)}
.tag-gold{background:rgba(245,158,11,.12);color:var(--gold);border:1px solid rgba(245,158,11,.3)}
.tag-blue{background:rgba(59,130,246,.12);color:var(--blue);border:1px solid rgba(59,130,246,.3)}
.tag-purple{background:rgba(139,92,246,.12);color:var(--purple);border:1px solid rgba(139,92,246,.3)}
.tag-muted{background:rgba(107,114,128,.12);color:var(--muted);border:1px solid rgba(107,114,128,.3)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:999;backdrop-filter:blur(4px)}
.modal{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;max-width:560px;width:90%;max-height:90vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:600;margin-bottom:16px}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
.bar-wrap{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:3px}
.bar-fill{height:100%;border-radius:3px;transition:width .4s}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty-title{font-size:16px;color:var(--text);margin-bottom:6px}
.chart-wrap{width:100%;overflow:hidden;margin-top:8px}
.chart-svg{width:100%;display:block}
.ai-bubble{border-radius:12px;padding:14px 16px;font-size:12px;line-height:1.7;margin-bottom:10px;max-width:92%}
.ai-bubble.ai{background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.25);align-self:flex-start}
.ai-bubble.user{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);align-self:flex-end;margin-left:auto}
.ai-typing{display:flex;gap:4px;align-items:center;padding:8px 0}
.ai-dot{width:6px;height:6px;background:var(--purple);border-radius:50%;animation:bounce .8s infinite}
.ai-dot:nth-child(2){animation-delay:.15s}.ai-dot:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 20px;font-size:12px;transition:transform .3s;z-index:9999;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
#update-bar{display:none;position:fixed;top:0;left:0;right:0;z-index:9998;background:linear-gradient(135deg,#065f46,#047857);border-bottom:1px solid #10b981;padding:10px 20px;font-size:12px;align-items:center;gap:12px}
#update-bar.show{display:flex}
#menu-toggle{display:none;background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;padding:4px}
.sidebar-close{display:none;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px;position:absolute;top:14px;right:14px}
.pl-row td:first-child{padding-left:24px;color:var(--muted)}
.pl-row td:last-child{text-align:right}
.pl-section td{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:2px;text-transform:uppercase;background:var(--row);padding:7px 10px}
.pl-total td{font-family:var(--serif);font-size:14px;font-weight:600;border-top:1px solid var(--border);padding:10px}
.pl-net td{font-family:var(--serif);font-size:18px;font-weight:600;border-top:2px solid var(--border);padding:12px 10px}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--dim);border-radius:2px}
@media(max-width:640px){
  #sidebar{position:fixed;left:0;top:0;height:100%;transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}
  .sidebar-close{display:block}
  #menu-toggle{display:block}
  #content{padding:14px}
  .kpi{min-width:calc(50% - 8px)}
}
</style>
</head>
<body>

<!-- UPDATE BAR -->
<div id="update-bar">
  <span style="flex:1;color:#d1fae5">🔄 <strong style="color:#fff">Nueva versión disponible.</strong> Actualiza para ver los últimos cambios.</span>

// PWA install
let deferredInstall;
window.addEventListener('beforeinstallprompt', e => {

  deferredInstall = e;

// ═══════════════════════════════════════════

  {re:/genova|beauty/i,code:"4020"},

function autoCategory(tx){
  const t=`${tx.description||''} ${tx.counterparty||''}`.toLowerCase();
  if(tx.amount>0){for(const r of AUTO_INCOME)if(r.re.test(t))return r.code;return"4090";}
  for(const r of AUTO_RULES)if(r.re.test(t))return r.code;return"5900";
}
const TABS=[
  {id:"dashboard",icon:"📊",label:"Dashboard",s:"reportes"},
  {id:"pl",icon:"📈",label:"P&L",s:"reportes"},
  {id:"balance",icon:"⚖️",label:"Balance General",s:"reportes"},

const SEC_LABELS={reportes:"📊 Reportes",plan:"📅 Planificación",datos:"📁 Datos",ia:"✨ IA",sistema:"⚙️ Sistema"};

  tab:"dashboard",year:2025,
  settings:{companyName:"Joint Strategy USA, LLC",state:"Florida",entity:"LLC Pass-Through",currency:"USD",mercuryApiKey:"",anthropicApiKey:""},
  coa:DEFAULT_COA,
  bankAccounts:[
    {id:"m3721",name:"Mercury Checking ••3721",bank:"Mercury",type:"checking",last4:"3721",color:"#10b981",note:"Cuenta principal",openingBalance:0,openingDate:"2025-01-01"},

    {id:"mcredit",name:"Mercury Credit (Tarjeta)",bank:"Mercury",type:"credit",last4:"",color:"#8b5cf6",note:"Tarjeta de crédito empresarial — balance = deuda actual",openingBalance:0,openingDate:"2025-01-01"},
  ],
  years:[2025],txns:[],budget:{},balanceEntries:[],aiMessages:[],
  filterSearch:"",filterCode:"",filterSign:"",
};

let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open("contaflow",4);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains("store"))d.createObjectStore("store");};r.onsuccess=e=>{db=e.target.result;res()};r.onerror=()=>rej("DB error");});}
function dbGet(k){return new Promise((res,rej)=>{const tx=db.transaction("store","readonly");const r=tx.objectStore("store").get(k);r.onsuccess=()=>res(r.result);r.onerror=rej});}
function dbSet(k,v){return new Promise((res,rej)=>{const tx=db.transaction("store","readwrite");tx.objectStore("store").put(v,k);tx.oncomplete=res;tx.onerror=rej;});}

async function loadState(){
  try{
    const s=await dbGet("settings");if(s)S.settings={...S.settings,...s};
    const c=await dbGet("coa");if(c)S.coa=c;
    const b=await dbGet("bankAccts");if(b)S.bankAccounts=b;
    const y=await dbGet("years");if(y){S.years=y;S.year=y[y.length-1]||2025;}
    const bg=await dbGet("budget");if(bg)S.budget=bg;
    const be=await dbGet("balanceEntries");if(be)S.balanceEntries=be;
    const ai=await dbGet("aiMessages");if(ai)S.aiMessages=ai;
    await loadYearTxns(S.year);
  }catch(e){console.warn(e)}
}
async function saveSettings(){await dbSet("settings",S.settings)}
async function saveCoa(){await dbSet("coa",S.coa)}
async function saveBankAccts(){await dbSet("bankAccts",S.bankAccounts)}
async function saveYears(){await dbSet("years",S.years)}
async function saveTxns(){await dbSet(`txns:${S.year}`,S.txns)}
async function saveBudget(){await dbSet("budget",S.budget)}
async function saveBalanceEntries(){await dbSet("balanceEntries",S.balanceEntries)}
async function saveAiMessages(){await dbSet("aiMessages",S.aiMessages)}
async function loadYearTxns(yr){const t=await dbGet(`txns:${yr}`);S.txns=t||[];}

async function syncMercury(year,apiKey){
  const BASE="https://api.mercury.com/api/v1";
  const hdrs={"Authorization":`Bearer ${apiKey}`};
  let all=[],limit=500,startAfter=null;
  while(true){
    const p=new URLSearchParams({postedStart:`${year}-01-01`,postedEnd:`${year}-12-31`,limit,order:"asc","status[]":"sent"});
    if(startAfter)p.set("start_after",startAfter);
    const res=await fetch(`${BASE}/transactions?${p}`,{headers:hdrs});
    if(!res.ok)throw new Error(`Mercury API: ${res.status}`);
    const data=await res.json();const batch=data.transactions||[];
    all=all.concat(batch);
    if(batch.length<limit||!data.page?.nextPage)break;
    startAfter=data.page.nextPage;
  }
  return all.filter(t=>{if(t.kind==="internalTransfer")return false;const bd=(t.bankDescription||"").toLowerCase();return!bd.includes("io autopay")&&!bd.includes("backup to primary");})
    .map(t=>({id:t.id,date:(t.postedAt||t.createdAt||"").slice(0,10),description:t.bankDescription||t.counterpartyName||"",amount:t.amount,counterparty:t.counterpartyName||"",note:t.note||"",kind:t.kind||"",accountId:t.accountId||"",coaCode:"",isManual:false}))
    .map(t=>({...t,coaCode:autoCategory(t)}));
}

async function handleSync(){
  const key=S.settings.mercuryApiKey?.trim();
  if(!key){showModal("sync-options");return;}
  const btn=document.getElementById("sync-btn");btn.disabled=true;setMsg("Conectando…");
  try{
    const fetched=await syncMercury(S.year,key);
    S.txns=[...fetched,...S.txns.filter(t=>t.isManual)];
    if(!S.years.includes(S.year)){S.years=[...S.years,S.year].sort();await saveYears();}
    await saveTxns();updateSidebar();renderContent();
    setMsg(`✅ ${fetched.length} transacciones`);toast(`✅ ${fetched.length} transacciones importadas`);
    setTimeout(()=>setMsg(""),5000);
  }catch(e){
    setErr("Error: "+e.message);
    if(e.message.includes("fetch")||e.message.includes("CORS")){setErr("⚠️ CORS. Usa Importar JSON.");showModal("sync-options");}
    setTimeout(()=>setErr(""),8000);
  }
  btn.disabled=false;
}

function fmt(n,abs=false){const v=abs?Math.abs(n):n;return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(v)}
function fmtDate(d){if(!d)return"";try{return new Date(d+"T00:00:00").toLocaleDateString("es-PR",{month:"short",day:"2-digit"})}catch{return d}}
function fmtDateFull(d){if(!d)return"";try{return new Date(d+"T00:00:00").toLocaleDateString("es-PR",{year:"numeric",month:"short",day:"2-digit"})}catch{return d}}
function catName(code){const c=S.coa.find(x=>x.code===code);return c?`${code} · ${c.name}`:(code||"—")}
function catTag(code){const c=S.coa.find(x=>x.code===code);const cls=!c?"tag-muted":c.type==="revenue"?"tag-green":c.type==="expense"?"tag-red":c.type==="asset"?"tag-blue":c.type==="equity"?"tag-gold":"tag-muted";return`<span class="tag ${cls}">${code||"—"}</span>`}
function toast(msg,dur=3000){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),dur)}
function escHtml(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function getTxMonth(t){return new Date(t.date+"T00:00:00").getMonth()}

function renderDashboard(){

  if(!txs.length)return emptyState("📊",`No hay datos para ${S.year}`,"Presiona Sincronizar o agrega entradas manuales.");
  const rev=txs.filter(t=>t.amount>0).reduce((s,t)=>s+t.amount,0);
  const exp=txs.filter(t=>t.amount<0).reduce((s,t)=>s+Math.abs(t.amount),0);
  const net=rev-exp,margin=rev>0?((net/rev)*100).toFixed(1):"0.0";
  const monthly=Array.from({length:12},(_,m)=>({m,lbl:MONTHS[m],inc:txs.filter(t=>t.amount>0&&getTxMonth(t)===m).reduce((s,t)=>s+t.amount,0),exp:txs.filter(t=>t.amount<0&&getTxMonth(t)===m).reduce((s,t)=>s+Math.abs(t.amount),0)}));
  const now=new Date();const curM=S.year===now.getFullYear()?now.getMonth():11;
  const active=monthly.filter(m=>m.m<=curM||m.inc>0||m.exp>0);
  const maxVal=Math.max(...active.flatMap(m=>[m.inc,m.exp]),1);
  const svgW=560,svgH=140,pL=52,pR=12,pT=10,pB=28,cW=svgW-pL-pR,cH=svgH-pT-pB;
  const colW=cW/active.length,barW=Math.min(colW*.35,18),gap=barW*.5;
  const yL=Array.from({length:5},(_,i)=>{const v=maxVal*(4-i)/4,y=pT+(cH*i/4);const l=v>=1000?`$${(v/1000).toFixed(1)}k`:`$${v.toFixed(0)}`;return`<line x1="${pL}" y1="${y.toFixed(1)}" x2="${svgW-pR}" y2="${y.toFixed(1)}" stroke="#1f2937" stroke-width="1" stroke-dasharray="3,3"/><text x="${(pL-4).toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="end" fill="#4b5563" font-size="9">${l}</text>`;}).join("");
  const bars=active.map((mo,i)=>{const cx=pL+i*colW+colW/2;const iH=mo.inc>0?Math.max((mo.inc/maxVal)*cH,3):0;const eH=mo.exp>0?Math.max((mo.exp/maxVal)*cH,3):0;return`<g>${mo.inc>0?`<rect x="${(cx-gap-barW).toFixed(1)}" y="${(pT+cH-iH).toFixed(1)}" width="${barW.toFixed(1)}" height="${iH.toFixed(1)}" fill="#10b981" fill-opacity=".85" rx="2"/>`:""}${mo.exp>0?`<rect x="${(cx+gap).toFixed(1)}" y="${(pT+cH-eH).toFixed(1)}" width="${barW.toFixed(1)}" height="${eH.toFixed(1)}" fill="#ef4444" fill-opacity=".85" rx="2"/>`:""}` +`<text x="${cx.toFixed(1)}" y="${(svgH-pB+14).toFixed(1)}" text-anchor="middle" fill="#6b7280" font-size="9">${mo.lbl}</text></g>`;}).join("");
  const svg=`<svg class="chart-svg" viewBox="0 0 ${svgW} ${svgH}" xmlns="http://www.w3.org/2000/svg"><line x1="${pL}" y1="${pT}" x2="${pL}" y2="${pT+cH}" stroke="#374151" stroke-width="1"/><line x1="${pL}" y1="${(pT+cH).toFixed(1)}" x2="${svgW-pR}" y2="${(pT+cH).toFixed(1)}" stroke="#374151" stroke-width="1"/>${yL}${bars}</svg>`;
  const expMap={},incMap={};
  txs.filter(t=>t.amount<0).forEach(t=>{const k=t.coaCode||"5900";expMap[k]=(expMap[k]||0)+Math.abs(t.amount)});
  txs.filter(t=>t.amount>0).forEach(t=>{const k=t.coaCode||"4090";incMap[k]=(incMap[k]||0)+t.amount});
  const topExp=Object.entries(expMap).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const qRows=QUARTERS.map(q=>{const qi=txs.filter(t=>q.months.includes(getTxMonth(t))&&t.amount>0).reduce((s,t)=>s+t.amount,0);const qe=txs.filter(t=>q.months.includes(getTxMonth(t))&&t.amount<0).reduce((s,t)=>s+Math.abs(t.amount),0);return`<tr><td style="color:var(--muted)">${q.label}</td><td style="color:#10b981;text-align:right">${qi>0?fmt(qi):"—"}</td><td style="color:#ef4444;text-align:right">${qe>0?fmt(qe):"—"}</td><td style="text-align:right;color:${(qi-qe)>=0?'#10b981':'#ef4444'};font-weight:600">${fmt(qi-qe)}</td></tr>`;}).join("");
  return`<div class="grid"><div class="card kpi"><div class="kpi-label">Ingresos</div><div class="kpi-val" style="color:#10b981">${fmt(rev)}</div><div class="kpi-sub">${txs.filter(t=>t.amount>0).length} transacciones</div></div><div class="card kpi"><div class="kpi-label">Gastos</div><div class="kpi-val" style="color:#ef4444">${fmt(exp)}</div><div class="kpi-sub">${txs.filter(t=>t.amount<0).length} transacciones</div></div><div class="card kpi"><div class="kpi-label">Utilidad Neta</div><div class="kpi-val" style="color:${net>=0?'#10b981':'#ef4444'}">${fmt(net)}</div><div class="kpi-sub">Margen ${margin}%</div></div><div class="card kpi"><div class="kpi-label">Transacciones</div><div class="kpi-val" style="color:#3b82f6">${txs.length}</div><div class="kpi-sub">Año ${S.year}</div></div></div>
  <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px"><div class="card" style="flex:2;min-width:260px"><div class="section-title" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><span>Ingresos vs Gastos · ${S.year}</span><div style="display:flex;gap:10px;font-size:10px;color:var(--muted)"><span><span style="display:inline-block;width:8px;height:8px;background:#10b981;border-radius:2px;margin-right:3px"></span>Ing</span><span><span style="display:inline-block;width:8px;height:8px;background:#ef4444;border-radius:2px;margin-right:3px"></span>Gas</span></div></div><div class="chart-wrap">${svg}</div></div><div class="card" style="flex:1;min-width:180px"><div class="section-title">Por Trimestre</div><table style="font-size:11px"><thead><tr><th>Q</th><th style="text-align:right">Ing</th><th style="text-align:right">Gas</th><th style="text-align:right">Neto</th></tr></thead><tbody>${qRows}</tbody></table></div></div>

let RECON={rows:[],matched:[],missing:[],unbacked:[],analyzed:false,accountId:""};
function parseCSVLine(line){
  const out=[];let cur="",inQ=false;
  for(let i=0;i<line.length;i++){const ch=line[i];
    if(inQ){if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++}else inQ=false}else cur+=ch}
    else{if(ch==='"')inQ=true;else if(ch===","){out.push(cur);cur=""}else cur+=ch}}
  out.push(cur);return out;
}
function detectAccount(srcAcct){
  const s=(srcAcct||"").toLowerCase();
  if(s.includes("3721"))return"m3721";
  if(s.includes("5416"))return"m5416";
  if(s.includes("5446"))return"m5446";
  if(s.includes("credit"))return"mcredit";
  return"";
}
function isInternalXfer(bd){
  const s=(bd||"").toLowerCase();
  return["io autopay","mercury initiated payment","percentage-based rule","transfer between your mercury accounts","backup to primary"].some(x=>s.includes(x));
}
function parseBankData(text){
  text=text.trim();
  // JSON array?
  if(text.startsWith("[")){try{const arr=JSON.parse(text);return arr.map(t=>({date:(t.date||"").slice(0,10),description:t.description||"",amount:parseFloat(t.amount)||0,accountId:t.accountId||"",kind:t.kind||"",status:"Sent",bankDesc:t.note||""}));}catch(e){return null}}
  // CSV Mercury
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length)return null;
  const hdr=parseCSVLine(lines[0]).map(h=>h.trim());
  const iDate=hdr.indexOf("Date (UTC)"),iDesc=hdr.indexOf("Description"),iAmt=hdr.indexOf("Amount"),iStat=hdr.indexOf("Status"),iSrc=hdr.indexOf("Source Account"),iBD=hdr.indexOf("Bank Description");
  if(iDate<0||iAmt<0)return null;
  return lines.slice(1).map(l=>{
    const c=parseCSVLine(l);
    const raw=c[iDate]||"";const m=raw.match(/^(\d{2})-(\d{2})-(\d{4})/);
    const date=m?`${m[3]}-${m[1]}-${m[2]}`:raw.slice(0,10);
    const bd=iBD>=0?c[iBD]:"";
    return{date,description:c[iDesc]||"",amount:parseFloat(c[iAmt])||0,accountId:detectAccount(iSrc>=0?c[iSrc]:""),kind:isInternalXfer(bd)?"transfer":"",status:iStat>=0?c[iStat]:"Sent",bankDesc:bd};
  }).filter(r=>r.status==="Sent");
}
function daysDiff(a,b){return Math.abs((new Date(a+"T00:00:00")-new Date(b+"T00:00:00"))/86400000)}
function runReconcile(){
  const text=document.getElementById("recon-input").value;
  const rows=parseBankData(text);
  if(!rows){toast("❌ No pude leer los datos. Pega el CSV de Mercury o un array JSON.");return;}
  const minD=rows.reduce((m,r)=>r.date<m?r.date:m,"9999-12-31");
  const maxD=rows.reduce((m,r)=>r.date>m?r.date:m,"0000-01-01");
  const usedBook=new Set();
  const matched=[],missing=[];
  rows.forEach(r=>{
    const cand=S.txns.filter(t=>!usedBook.has(t.id)&&Math.abs(t.amount-r.amount)<0.005&&daysDiff(t.date,r.date)<=3&&(!r.accountId||!t.accountId||t.accountId===r.accountId));
    if(cand.length){cand.sort((a,b)=>daysDiff(a.date,r.date)-daysDiff(b.date,r.date));usedBook.add(cand[0].id);matched.push({bank:r,book:cand[0]});}
    else missing.push(r);
  });
  const unbacked=S.txns.filter(t=>!usedBook.has(t.id)&&t.date>=minD&&t.date<=maxD&&(!RECON.accountId||t.accountId===RECON.accountId)&&!t.reconciled);
  RECON={...RECON,rows,matched,missing,unbacked,analyzed:true};
  renderContent();
}

  const ids=new Set(RECON.matched.map(m=>m.book.id));
  S.txns=S.txns.map(t=>ids.has(t.id)?{...t,reconciled:true}:t);
  await saveTxns();toast(`✅ ${ids.size} transacciones conciliadas`);RECON.matched=[];renderContent();

function computeAccountBalance(accountId,asOfDate){
  const acc=S.bankAccounts.find(a=>a.id===accountId);
  if(!acc)return 0;
  const opening=acc.openingBalance||0;
  const openDate=acc.openingDate||"1900-01-01";
  const relevant=S.txns.filter(t=>t.accountId===accountId&&t.date>=openDate&&(!asOfDate||t.date<=asOfDate));
  const sum=relevant.reduce((s,t)=>s+t.amount,0);
  return acc.type==="credit"?opening-sum:opening+sum;

async function sendAiQuestion(msg){
  S.aiMessages.push({role:"user",content:msg});renderContent();
  setTimeout(()=>{const el=document.getElementById("ai-chat-messages");if(el)el.scrollTop=el.scrollHeight},50);
  const btn=document.getElementById("ai-send-btn");if(btn)btn.disabled=true;
  const rev=S.txns.filter(t=>t.amount>0).reduce((s,t)=>s+t.amount,0);
  const exp=S.txns.filter(t=>t.amount<0).reduce((s,t)=>s+Math.abs(t.amount),0),net=rev-exp;
  const topExp={};S.txns.filter(t=>t.amount<0).forEach(t=>{const k=t.coaCode||"5900";topExp[k]=(topExp[k]||0)+Math.abs(t.amount)});
  const sys=`Eres el CFO de José Capote para ${S.settings.companyName} (${S.settings.entity}, ${S.settings.state}).\nAño: ${S.year} | Ingresos: ${fmt(rev)} | Gastos: ${fmt(exp)} | Utilidad: ${fmt(net)} | Margen: ${rev>0?((net/rev)*100).toFixed(1):0}%\nTop gastos: ${Object.entries(topExp).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([c,v])=>`${catName(c)}: ${fmt(v)}`).join(", ")}\nProyectos: Catedral, Genova eCommerce, Marketing GHL, Bienes Raíces FL.\nFlorida LLC Pass-Through. Responde en español, directo y práctico. Máx 200 palabras.`;
  try{
    const history=S.aiMessages.slice(-8).map(m=>({role:m.role==="ai"?"assistant":"user",content:m.content}));
    const resp=await callClaudeWithSystem(sys,history);
    S.aiMessages.push({role:"ai",content:resp});await saveAiMessages();renderContent();
    setTimeout(()=>{const el=document.getElementById("ai-chat-messages");if(el)el.scrollTop=el.scrollHeight},50);
  }catch(e){S.aiMessages.push({role:"ai",content:`❌ ${e.message}`});renderContent();}
  if(btn)btn.disabled=false;
}

async function importJSON(){
  const text=document.getElementById("import-text").value.trim();
  try{
    const data=JSON.parse(text);
    if(data.version&&data.transactions){
      if(data.settings){S.settings={...S.settings,...data.settings};await saveSettings()}
      if(data.coa){S.coa=data.coa;await saveCoa()}
      if(data.bankAccounts){S.bankAccounts=data.bankAccounts;await saveBankAccts()}
      if(data.years){S.years=data.years;await saveYears()}
      if(data.budget){S.budget=data.budget;await saveBudget()}
      if(data.balanceEntries){S.balanceEntries=data.balanceEntries;await saveBalanceEntries()}
      for(const [y,txs] of Object.entries(data.transactions||{}))await dbSet(`txns:${y}`,txs.map(t=>({...t,coaCode:t.coaCode||autoCategory(t)})));
      await loadYearTxns(S.year);closeModal();updateSidebar();renderContent();toast("✅ Respaldo importado");
    }else if(Array.isArray(data)){
      const mapped=data.map(t=>({id:t.id||`imp_${Date.now()}_${Math.random()}`,date:(t.date||t.postedAt||"").slice(0,10),description:t.description||t.bankDescription||t.counterpartyName||"",amount:t.amount||0,counterparty:t.counterparty||t.counterpartyName||"",note:t.note||"",kind:t.kind||"",accountId:t.accountId||"",coaCode:t.coaCode||autoCategory(t),isManual:false}));
      // Merge: use both id AND date+description+amount as duplicate keys
      const dupKey=t=>`${t.date}|${t.description}|${t.amount}`;
      const newIds=new Set(mapped.map(t=>t.id));
      const newKeys=new Set(mapped.map(t=>dupKey(t)));
      const existing=S.txns.filter(t=>!newIds.has(t.id)&&!newKeys.has(dupKey(t)));
      S.txns=[...existing,...mapped];await saveTxns();
      if(!S.years.includes(S.year)){S.years=[...S.years,S.year].sort();await saveYears()}
      closeModal();updateSidebar();renderContent();toast(`✅ ${mapped.length} transacciones importadas`);
    }else toast("❌ Formato no reconocido");
  }catch(e){toast("❌ Error JSON: "+e.message)}
}

function renderContent(){
  const el=document.getElementById("content");
  const map={dashboard:renderDashboard,pl:renderPL,balance:renderBalance,projects:renderProjects,budget:renderBudget,cashflow:renderCashflow,taxes:renderTaxes,txns:renderTxns,reconcile:renderReconcile,transfers:renderTransfers,accounts:renderAccounts,coa:renderCoa,ai:renderAI,settings:renderSettings};
  el.innerHTML=(map[S.tab]||renderDashboard)();
}

(async()=>{
  await openDB();await loadState();buildNav();buildYearSelect();updateSidebar();renderContent();
})();
</script>
</body>
</html>
